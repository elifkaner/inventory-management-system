services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env.local
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./src/InventoryManagement.API/.env
    environment:
      DB_HOST: postgres
      ASPNETCORE_URLS: http://0.0.0.0:5000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5050:5000"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5050
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5050
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
